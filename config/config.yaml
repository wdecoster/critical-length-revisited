# Critical length revisited: stage 1 (data inventory, ladder steps 1-2). See docs/plan.md.
# Server-specific settings (reference, output_root) go in config/server.yaml (scripts/setup_server.sh).

outdir: results
# relative outdir and resource paths are under output_root (e.g. a study folder)
output_root: .
# GRCh38 no-alt analysis set (with .fai), as in 2020
reference: resources/GRCh38_no_alt_analysis_set.fa

# HG002 truth: GIAB v5.0q (draft, from HG002-Q100 v1.1 by dipcall), stratifications v3.6
truth:
  giab_url: https://ftp-trace.ncbi.nlm.nih.gov/ReferenceSamples/giab/release/AshkenazimTrio/HG002_NA24385_son/v5.0q
  files:
    HG002_GRCh38_v5.0q_stvar.vcf.gz: 34dbeeac5eb3fc09e94c5cb8cfe9e24f
    HG002_GRCh38_v5.0q_stvar.benchmark.bed: 55fc11c80ff376c0a8da99d0c69004f3
    dipcall_output/GRCh38_HG2-T2TQ100-V1.1_dipcall-z2k.dip.vcf.gz: 9a2ddc7af03fa89c6a356fd67fa31fef
    dipcall_output/GRCh38_HG2-T2TQ100-V1.1_dipcall-z2k.dip.bed: b2d09d5d698e859ae06251061679d15a
  stratifications_url: https://ftp-trace.ncbi.nlm.nih.gov/ReferenceSamples/giab/release/genome-stratifications/v3.6/GRCh38@all
  stratifications:
    tandem_repeats: LowComplexity/GRCh38_AllTandemRepeats.bed.gz
    homopolymers: LowComplexity/GRCh38_AllHomopolymers_ge7bp_imperfectge11bp_slop5.bed.gz
    segdups: SegmentalDuplications/GRCh38_segdups.bed.gz
    segdups_gt10kb: SegmentalDuplications/GRCh38_segdups_gt10kb.bed.gz
    low_mappability: Mappability/GRCh38_lowmappabilityall.bed.gz
    all_difficult: Union/GRCh38_alldifficultregions.bed.gz

# Assemblies reads are simulated from (ladder) and truth is derived from in the 2020 way. Haplotypes are
# either separate files (hap1/hap2) or one diploid file split by the NCBI assembly report's assembly units.
assemblies:
  HG002_Q100:
    hap1: https://s3-us-west-2.amazonaws.com/human-pangenomics/T2T/HG002/assemblies/hg002v1.1.mat.fasta.gz
    hap2: https://s3-us-west-2.amazonaws.com/human-pangenomics/T2T/HG002/assemblies/hg002v1.1.pat.fasta.gz
  # the 2020 assembly: FALCON-Phase, both phases in one GenBank assembly (units phase0, phase1)
  HG00733_2020:
    diploid: https://ftp.ncbi.nlm.nih.gov/genomes/all/GCA/003/634/875/GCA_003634875.1_HG00733_Phased_Diploid/GCA_003634875.1_HG00733_Phased_Diploid_genomic.fna.gz
    report: https://ftp.ncbi.nlm.nih.gov/genomes/all/GCA/003/634/875/GCA_003634875.1_HG00733_Phased_Diploid/GCA_003634875.1_HG00733_Phased_Diploid_assembly_report.txt
    units: [phase0, phase1]

# HG002 ONT R10.4.1 read sets (public). Downloaded ones are kept (Arm A cuts them later); streamed ones are
# only read for the inventory.
read_sets:
  ulk:
    description: ONT London Calling 2024, SQK-ULK114, 2 PromethION flow cells, sup v5.0.0, unaligned BAM
    urls:
      - https://ont-open-data.s3.amazonaws.com/londoncalling2024/assembly/basecalling/ulk/PAW42495.bam
      - https://ont-open-data.s3.amazonaws.com/londoncalling2024/assembly/basecalling/ulk/PAW42666.bam
    download: true
  standard:
    description: ONT giab_2025.01, SQK-LSK114, 2 PromethION flow cells, sup, aligned BAM (index does not match; streamed without it)
    urls:
      - https://ont-open-data.s3.amazonaws.com/giab_2025.01/basecalling/sup/HG002/PAW70337/calls.sorted.bam
      - https://ont-open-data.s3.amazonaws.com/giab_2025.01/basecalling/sup/HG002/PAW71238/calls.sorted.bam
    download: false

inventory:
  # haploid genome size used to convert bases to coverage
  genome_size: 3100000000
  # lengths (bp) for the coverage that remains after cutting reads into pieces of that length
  lengths: [1000, 2000, 3000, 5000, 7500, 10000, 15000, 20000, 30000, 50000, 75000, 100000, 150000, 200000, 300000, 500000]

# Ladder steps 1-2 (docs/plan.md): the 2020 pipeline (SimLoRD fixed-length reads, minimap2 2.14 map-pb,
# Sniffles 1.0.10, paftools truth, SURVIVOR/surpyvor-style matching) on HG00733 (2020) and HG002-Q100 v1.1
ladder:
  genomes: [HG00733_2020, HG002_Q100]
  lengths: [1000, 5000, 20000, 50000, 100000, 300000, 500000]
  # simulated coverage per genome (haploid-equivalent, even). HG00733 at 40x as in 2020 (step 1 reproduces
  # Fig. 1); every genome is evaluated at each coverage of 'coverages' up to its simulated coverage,
  # subsampled from it. Steps 1 and 2 are compared at 20x.
  simulated_coverage:
    HG00733_2020: 40
    HG002_Q100: 20
  coverages: [40, 20]
  # alignments (~60 GB per 20x of CLR-like reads) are deleted once called, unless kept
  keep_bams: false
  # the assembly is split into this many chunks of whole sequences, simulated in parallel
  chunks: 40
  # Sniffles 1 settings: default as in 2020; splits1000 tests the split filter at the longest lengths
  sniffles1:
    default: {args: "", min_length: 0}
    splits1000: {args: "--max_num_splits 1000", min_length: 100000}
  # 2020 matching: SURVIVOR merge, distance 500, same type, min. length 50
  match_distance: 500
  min_sv_length: 50

# Stage 2: the pilot (docs/plan.md, milestone 3). Arm A: real reads cut to fixed lengths. Parent reads are
# selected by where they map: the pilot chromosomes, plus the paralog partners elsewhere of the pilot's
# segmental duplications (UCSC genomicSuperDups), so reads that could mismap into pilot SDs are present.
# Pieces are always aligned to the whole genome; evaluation is on the GIAB benchmark regions of the pilot
# chromosomes, where coverage is also measured.
pilot:
  chromosomes: [chr1, chr7, chr15, chr16, chr20]
  sd_partners: true
  superdups_url: https://hgdownload.soe.ucsc.edu/goldenPath/hg38/database/genomicSuperDups.txt.gz
  # lengths per read set: ulk is the main source, standard (giab_2025.01) the calibration at 10-30 kb
  read_sets:
    ulk:
      lengths: [1000, 2000, 3000, 5000, 7500, 10000, 15000, 20000, 30000, 50000, 75000, 100000, 150000]
    standard:
      lengths: [10000, 20000, 30000]
  # coverage: the longest length it is evaluated at (coverage measured in the evaluation regions; lower
  # coverages are subsampled from the alignment of the highest one)
  coverages: {30: 50000, 15: 150000}
  # cut placement seeds: seed 1 everywhere, more replicates at a few lengths
  seeds: [1]
  replicates: {seeds: [2, 3], lengths: [5000, 20000, 100000], read_sets: [ulk]}
  # Length distributions (milestone 4, the N50 recommendation): the pilot's parent reads of `parents` cut to
  # pieces whose lengths follow a real library's read length distribution (its inventory histogram), rescaled to
  # each N50 (cut_reads.py distribution mode). Runs are L N<n50><shape> next to the fixed lengths and go through
  # the same alignment, calling and scoring; snakemake pilot_distributions. Coverages and callers by N50 as above.
  distributions:
    parents: ulk
    shapes: [standard, ulk]
    n50s: [5000, 8000, 10000, 15000, 20000, 30000, 50000, 100000]
    coverages: {30: 50000, 15: 100000}
    seeds: [1]
  # pieces kept before alignment: this factor x the highest coverage x the selection regions' size, then
  # subsampled exactly after alignment. About 70% of the kept bases land in the evaluation regions (the rest:
  # SD partner regions, non-benchmark sequence, unmapped), so 1.3 fell short (pilot: 26-27.5x for 30x, 11.5-12.5x
  # for 15x at >= 75 kb); 1.8 reaches the targets (at 150 kb nearly all pieces are kept: about 16x)
  oversample: 1.8
  callers:
    # Sniffles2 with its coverage-adaptive defaults; its MAPQ filter (--mapq) shapes behaviour in SDs: record
    # the version's default in the post
    sniffles2: {lengths: all, args: ""}
    # cuteSV with ONT-recommended clustering; minimum support scaled to coverage (its fixed default -s 10
    # was the 2020 flaw)
    cutesv:
      lengths: [5000, 20000, 100000]
      args: "--max_cluster_bias_INS 100 --diff_ratio_merging_INS 0.3 --max_cluster_bias_DEL 100 --diff_ratio_merging_DEL 0.3"
      support_fraction: 0.1
      min_support: 2
  # truvari scoring: strict is GIAB's setup (followed by truvari refine), lenient ignores sequence and DUP/INS
  scoring:
    strict: {args: "--pick ac --passonly -r 2000 -C 5000 --sizemax -1", refine: true}
    lenient: {args: "--pick ac --passonly -r 2000 -C 5000 --sizemax -1 --dup-to-ins --pctseq 0", refine: false}
  # strata: SV size bins (bp, lower edges) and context, first match wins (stratifications above)
  size_bins: [50, 100, 300, 1000, 6000, 10000, 50000]
  contexts: [segdups, tandem_repeats, low_mappability]
  # reads spanning each truth SV +/- this flank (mechanistic view), counted at this minimum MAPQ
  spanning_flank: 1000
  spanning_mapq: 20
  # alignments are deleted once called, except at these lengths (figures). Empty: the pilot's kept BAMs were
  # deleted (2026-10-28), figures can show slices of a rerun instead
  keep_bams_lengths: []

# Assembly follow-up, regional arm (docs/assembly_plan.md, milestone 1). Windows of the genome are assembled per
# haplotype from the reads that map there, the way regional pangenome pipelines do: DeepVariant SNVs, WhatsHap
# phasing and haplotagging, untagged reads to both haplotypes, Flye per haplotype (hifiasm as the alternative).
# Read selection: full-length reads aligned to the windows +/- margin or to the windows' SD partners elsewhere
# are cut, the pieces aligned to the whole genome, and a window's reads are the pieces that land in it.
# Truth: the matching HG002 Q100 haplotype sequence of each window (anchored on the window boundaries).
# snakemake regional
regional:
  read_set: ulk
  windows:
    size: 500000
    seed: 1
    # windows per class (select_windows.py); milestone 1 is a small set for plumbing and timing
    classes: {plain: 2, segdup: 1, tandem_repeat: 1, large_insertion: 0}
    # named windows, as chrom:start-end (GRCh38). MAPT: the 17q21.31 inversion region with its flanking LRRC37A
    # segmental duplications, approximate; check against the SD annotation and the truth anchors
    named:
      MAPT: chr17:45500000-46850000
  # reads overlapping a window +/- flank are assembled; the truth is the window itself
  flank: 50000
  # full-length parent reads: aligned to the windows +/- margin, or to their SD partners elsewhere
  selection_margin: 1000000
  # conditions: library N50s (standard shape, as the SV post) and fixed lengths; coverages per sample, the
  # lower ones subsampled from the alignment of the highest
  n50s: [10000, 30000]
  shape: standard
  lengths: []
  coverages: [30]
  seeds: [1]
  oversample: 1.8
  # haplotype assignment: realistic (DeepVariant + WhatsHap + haplotag) and oracle (pieces assigned to the truth
  # haplotype they align to best; a ceiling)
  modes: [realistic, oracle]
  # haploid per-haplotype assemblers, plus hifiasm diploid on all reads of the window (mode 'diploid')
  assemblers: [flye, hifiasm]
  diploid: true
  flye_extra: "--no-alt-contigs"
  hifiasm_extra: "-l0"
  min_read_length: 1000
  deepvariant_container: docker://google/deepvariant:1.8.0
  deepvariant_model: ONT_R104
  # a haplotype is complete when one contig covers >= this fraction of its truth window
  complete_fraction: 0.95
  # truth anchors: reference sequence just outside each window boundary, moved outward in steps when not unique
  anchor_length: 5000
  anchor_steps: [0, 10000, 25000, 50000, 100000]
